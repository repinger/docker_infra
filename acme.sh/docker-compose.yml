name: "acme.sh"

services:
  acme-sh:
    image: neilpang/acme.sh:latest
    container_name: acme.sh
    environment:
      TZ: "${TZ:-UTC}"
    hostname: acme.sh
    volumes:
      - ./data:/acme.sh
      - ./certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    command: daemon
    stdin_open: true
    tty: true
    restart: always
